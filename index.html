<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetricsHub Dashboard</title>
    <!-- Nhúng Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. NAVBAR (FLEXBOX) -->
    <nav class="new-navbar">
        <div class="logo fw-bold fs-4">MetricsHub</div>
        <div class="menu">
            Home | About | VeryLongGermanWordForDashboard | Contact
        </div>
        <div class="profile">Profile</div>
    </nav>

    <!-- 2. DASHBOARD (CSS GRID) -->
    <main class="container my-5">
        <h2 class="mb-4">Bento Dashboard</h2>
        <div class="grid-dashboard">
            <!-- Xóa bỏ các thẻ .column, làm phẳng DOM -->
            <div class="widget widget-large">
                <h4>Chart A</h4>
                <p>(Span 2 hàng, 2 cột)</p>
            </div>
            <div class="widget">Chart B</div>
            <div class="widget">Chart C</div>
            <div class="widget">Chart D</div>
            <div class="widget">Chart E</div>
        </div>
    </main>

    <!-- 3. PRICING (BOOTSTRAP GRID) -->
    <section class="container my-5">
        <h2 class="mb-4 text-center">Pricing Plans</h2>
        <!-- Hệ thống lưới Bootstrap: col-md-4 chia 3 cột trên màn trung bình/lớn, tự xếp chồng trên mobile -->
        <div class="row g-4">
            <div class="col-12 col-md-4">
                <div class="card h-100 text-center shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Gói Cơ bản</h5>
                        <p class="card-text">Dành cho cá nhân</p>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card h-100 text-center shadow-sm border-primary">
                    <div class="card-body">
                        <h5 class="card-title text-primary">Gói Nâng cao</h5>
                        <p class="card-text">Dành cho nhóm nhỏ</p>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card h-100 text-center shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Gói Doanh nghiệp</h5>
                        <p class="card-text">Dành cho tập đoàn</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
