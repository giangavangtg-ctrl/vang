<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Responsive Gallery</title>
    <!-- Nhúng Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5">
        <h2 class="text-center mb-4">Gallery Ảnh Responsive</h2>
        <div class="row g-4">
            <!-- Sử dụng chính xác class: col-12 (Mobile), col-sm-6 (Tablet), col-lg-3 (Desktop) -->
            <div class="col-12 col-sm-6 col-lg-3">
                <img src="https://via.placeholder.com/600x400?text=Ảnh+1" class="img-fluid rounded" alt="Gallery image 1">
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <img src="https://via.placeholder.com/600x400?text=Ảnh+2" class="img-fluid rounded" alt="Gallery image 2">
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <img src="https://via.placeholder.com/600x400?text=Ảnh+3" class="img-fluid rounded" alt="Gallery image 3">
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
                <img src="https://via.placeholder.com/600x400?text=Ảnh+4" class="img-fluid rounded" alt="Gallery image 4">
            </div>
        </div>
    </div>
</body>
</html>
